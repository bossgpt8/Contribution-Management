openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Contribution Management (Ajo/Thrift) API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: members
    description: Member management
  - name: transactions
    description: Transaction management
  - name: reports
    description: Reports and analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ---------- AUTH ----------
  /auth/member/login:
    post:
      operationId: memberLogin
      tags: [auth]
      summary: Member login with contribution number and optional PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/admin/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- MEMBERS ----------
  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List all members (admin only)
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: createMember
      tags: [members]
      summary: Create a new member (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /members/{id}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get a member by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update a member (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Delete a member (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /members/{id}/transactions:
    get:
      operationId: listMemberTransactions
      tags: [transactions]
      summary: List transactions for a member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create a transaction for a member (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/{id}:
    patch:
      operationId: updateTransaction
      tags: [transactions]
      summary: Update a transaction (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete a transaction (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ---------- REPORTS (WOW ENDPOINTS) ----------
  /reports/summary:
    get:
      operationId: getReportSummary
      tags: [reports]
      summary: Get overall summary stats (admin only)
      responses:
        "200":
          description: Summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSummary"

  /reports/recent-transactions:
    get:
      operationId: getRecentTransactions
      tags: [reports]
      summary: Get recent transactions across all members (admin only)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentTransaction"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # --- AUTH ---
    MemberLoginInput:
      type: object
      required: [contributionNumber]
      properties:
        contributionNumber:
          type: string
          minLength: 1
        pin:
          type: string

    AdminLoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    AuthSession:
      type: object
      required: [role, id]
      properties:
        role:
          type: string
          enum: [member, admin]
        id:
          type: integer
        name:
          type: ["string", "null"]
        contributionNumber:
          type: ["string", "null"]
        username:
          type: ["string", "null"]

    # --- MEMBER ---
    Member:
      type: object
      required: [id, contributionNumber, fullName, status, dateJoined, createdAt]
      properties:
        id:
          type: integer
        contributionNumber:
          type: string
        fullName:
          type: string
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        dateJoined:
          type: string
          format: date
        status:
          type: string
          enum: [active, inactive]
        hasPin:
          type: boolean
        currentBalance:
          type: number
        createdAt:
          type: string
          format: date-time

    MemberInput:
      type: object
      required: [contributionNumber, fullName, dateJoined]
      properties:
        contributionNumber:
          type: string
          minLength: 1
        fullName:
          type: string
          minLength: 1
        phone:
          type: string
        address:
          type: string
        dateJoined:
          type: string
          format: date
        status:
          type: string
          enum: [active, inactive]
          default: active
        pin:
          type: string

    MemberUpdate:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
        phone:
          type: string
        address:
          type: string
        dateJoined:
          type: string
          format: date
        status:
          type: string
          enum: [active, inactive]
        pin:
          type: string

    # --- TRANSACTION ---
    Transaction:
      type: object
      required: [id, memberId, date, description, debit, credit, runningBalance, createdAt]
      properties:
        id:
          type: integer
        memberId:
          type: integer
        date:
          type: string
          format: date
        description:
          type: string
        debit:
          type: number
        credit:
          type: number
        runningBalance:
          type: number
        createdAt:
          type: string
          format: date-time

    TransactionInput:
      type: object
      required: [date, description]
      properties:
        date:
          type: string
          format: date
        description:
          type: string
          minLength: 1
        debit:
          type: number
          default: 0
        credit:
          type: number
          default: 0

    TransactionUpdate:
      type: object
      properties:
        date:
          type: string
          format: date
        description:
          type: string
          minLength: 1
        debit:
          type: number
        credit:
          type: number

    # --- REPORTS ---
    ReportSummary:
      type: object
      required: [totalMembers, activeMembers, totalContributions, totalWithdrawals, netBalance]
      properties:
        totalMembers:
          type: integer
        activeMembers:
          type: integer
        totalContributions:
          type: number
        totalWithdrawals:
          type: number
        netBalance:
          type: number

    RecentTransaction:
      type: object
      required: [id, memberId, memberName, contributionNumber, date, description, debit, credit, runningBalance, createdAt]
      properties:
        id:
          type: integer
        memberId:
          type: integer
        memberName:
          type: string
        contributionNumber:
          type: string
        date:
          type: string
          format: date
        description:
          type: string
        debit:
          type: number
        credit:
          type: number
        runningBalance:
          type: number
        createdAt:
          type: string
          format: date-time
