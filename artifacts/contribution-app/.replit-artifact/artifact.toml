kind = "web"
previewPath = "/"
title = "Contribution Manager"
version = "1.0.0"
id = "artifacts/contribution-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21192

[services.development]
run = "pnpm --filter @workspace/contribution-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/contribution-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/contribution-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21192"
BASE_PATH = "/"
